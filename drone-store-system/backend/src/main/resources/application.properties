# Server Port Configuration
server.port=${SERVER_PORT:8070}

# Spring Datasource Configuration (Supabase PostgreSQL JDBC)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:6543}/${DB_NAME:postgres}?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Migration Configuration (Runs schema migrations against Supabase)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Supabase API Gateway Properties
supabase.url=${SUPABASE_URL:https://shuomuvvemiesoxyabnp.supabase.co}
supabase.anon-key=${SUPABASE_ANON_KEY:}
supabase.secret-key=${SUPABASE_SECRET_KEY:}

# Security & JWT Configuration
dronestore.jwt.secret=${JWT_SECRET}
dronestore.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Jackson JSON formatting
spring.jackson.serialization.write-dates-as-timestamps=false
