# Server Port Configuration (Priority: PORT -> SERVER_PORT -> 8070)
server.port=${PORT:${SERVER_PORT:8070}}

# Spring Datasource Configuration (Supabase PostgreSQL JDBC)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Hikari Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# Tomcat Worker Thread Optimization for 512MB RAM
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=20

# Flyway Configuration (Disabled for Supabase Transaction Pooler lock incompatibility)
spring.flyway.enabled=false

# Supabase API Gateway Properties
supabase.url=${SUPABASE_URL:https://shuomuvvemiesoxyabnp.supabase.co}
supabase.anon-key=${SUPABASE_ANON_KEY:}
supabase.secret-key=${SUPABASE_SECRET_KEY:}

# Security & JWT Configuration
dronestore.jwt.secret=${JWT_SECRET:dronestoresupersecretjwtkeyforauthentication20261234567890!}
dronestore.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Spring Multipart Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
server.tomcat.max-swallow-size=20MB
server.tomcat.max-http-form-post-size=20MB

# Jackson JSON formatting
spring.jackson.serialization.write-dates-as-timestamps=false

# Redis & Cache Configuration
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
spring.redis.timeout=${REDIS_TIMEOUT:2000ms}
spring.redis.url=${REDIS_URL:}
spring.redis.lettuce.pool.max-active=16
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=2
spring.redis.lettuce.pool.max-wait=1000ms
spring.redis.lettuce.shutdown-timeout=100ms

# Cache TTL Configuration (in seconds)
dronestore.cache.ttl.products-catalog=${CACHE_TTL_PRODUCTS_CATALOG:600}
dronestore.cache.ttl.product-detail=${CACHE_TTL_PRODUCT_DETAIL:900}
dronestore.cache.ttl.product-children=${CACHE_TTL_PRODUCT_CHILDREN:900}
dronestore.cache.ttl.product-images=${CACHE_TTL_PRODUCT_IMAGES:900}
dronestore.cache.ttl.product-sections=${CACHE_TTL_PRODUCT_SECTIONS:900}
dronestore.cache.ttl.categories=${CACHE_TTL_CATEGORIES:900}
dronestore.cache.ttl.default=${CACHE_TTL_DEFAULT:600}


